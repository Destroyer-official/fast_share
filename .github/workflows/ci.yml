name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-python:
    name: Python Server Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run Integration Tests
        run: |
          python -m unittest tests/test_fastshare.py

  test-rust:
    name: Rust Core Build & Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Cargo Check
        run: |
          cargo check --manifest-path fastshare_rs/Cargo.toml
      - name: Cargo Build Release
        run: |
          cargo build --release --manifest-path fastshare_rs/Cargo.toml

  build-android:
    name: Android APK Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew
      - name: Build Android Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon
      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: fastshare-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
